# 校园二手 — 28 页面规约（信息层级 + UX copy + ChatGPT prompt）
#
# 用途：
#   1) 给 ChatGPT GPT-Image 生成 mockup PNG 的 prompt 来源
#   2) Claude Code 实现页面时的 UX copy / 信息层级依据
#   3) 每页 acceptance criteria 的参考
#
# 字段说明：
#   id              页面唯一编号 P<NN>_<name>
#   title           中文页面名（导航栏标题）
#   path            微信小程序 page 路径
#   tier            V1 既有 / V2 新增
#   vant_components 用到的 Vant Weapp 组件
#   copy            关键 UX 文案（中文，按 design:ux-copy 原则编写）
#   layout          页面分区描述（top/main/bottom）
#   states          需要覆盖的页面状态
#   prompt          ChatGPT GPT-Image 生成 mockup 的英文 prompt

meta:
  version: "1.0.1"
  updated: "2026-05-14"
  total_pages: 28

# ============================================================
# Vant Weapp 组件使用注意（subagent 派发时必读，避免误注册）
# ============================================================
# ✅ Vant Weapp 实际拥有的组件参见 frontend/app.json 的 usingComponents
#
# ❌ 不要用以下「看似存在但实际不存在」的组件：
#   - van-step（单数）— 不存在；van-steps 是数据驱动，传 steps 数组属性
#       <van-steps steps="{{ stepsData }}" active="{{ active }}" />
#   - van-badge — 不存在；用其他组件的 info 属性挂角标
#       <van-icon name="bell" info="3" />
#       <van-tabbar-item info="5" icon="..." />
#
# 复合组件父子关系（父组件通过 slot 接子组件，但子组件需独立注册）：
#   - van-tabs + van-tab（OK，都要注册）
#   - van-tabbar + van-tabbar-item（OK，都要注册）
#   - van-cell-group + van-cell（OK，都要注册）
#   - van-radio-group + van-radio（OK，都要注册）
#   - van-checkbox-group + van-checkbox（OK，都要注册）
#   - van-goods-action + van-goods-action-button / van-goods-action-icon（OK）
#
# 派发新页面 subagent 时必须告诉它：
#   1) 写 wxml 前先 grep app.json 中 usingComponents 确认组件存在
#   2) 看 Vant Weapp 官网（https://vant.pro/vant-weapp/）查标签用法
# ============================================================
  global_style: |
    A WeChat Mini Program **screenshot** of an iOS app called "校园二手"
    (campus second-hand trading), shown inside an iPhone 15 Pro frame.

    Design language: light theme, white card on #f4f5f7 page background.
    Primary green #1aad19, accent red #ee0a24 for price, gold #f0a020 for coins.
    Rounded corners 12-24px, soft shadows.
    Chinese typography, system PingFang SC.

    The image MUST look like a real production app screenshot,
    NOT illustration, NOT mockup wireframe, NOT concept art.
    Status bar: iOS 9:41, full signal, full battery.
    Render at 1024 x 1536 (mobile portrait).

# ============================================================
# 认证（2 页）
# ============================================================

- id: P01_login
  title: 登录
  path: pages/auth/login
  tier: V1
  vant_components: [van-button]
  copy:
    hero_title: 校园二手
    hero_subtitle: 校园里的闲置交易，靠谱又方便
    wx_login_btn: 微信一键登录
    privacy_hint: 登录即同意《用户协议》与《隐私政策》
  layout:
    top: 顶部品牌区，logo + slogan
    main: 大块留白
    bottom: 居中绿色微信登录按钮 + 协议提示小字
  states: [normal, loading]
  prompt: |
    Login screen.
    Top 40% of screen: centered logo "校园二手" in big bold green #1aad19,
    subtitle "校园里的闲置交易，靠谱又方便" in gray.
    Below: lots of whitespace.
    Bottom 30%: full-width green button "微信一键登录" with WeChat icon,
    rounded corners 16px.
    Below the button: small gray text "登录即同意《用户协议》与《隐私政策》"
    with the two doc names in green underlined link style.

- id: P02_password
  title: 修改密码
  path: pages/auth/password
  tier: V1
  vant_components: [van-cell-group, van-field, van-button]
  copy:
    nav_title: 修改密码
    old_label: 当前密码
    new_label: 新密码
    confirm_label: 确认新密码
    submit: 保存
    rule_hint: 至少 8 位，含字母和数字
    success_toast: 密码已更新
  layout:
    top: 导航栏
    main: 三个 van-field（当前密码 / 新密码 / 确认新密码） + 规则提示
    bottom: 保存按钮（吸底）
  states: [normal, validating, error]
  prompt: |
    Password change screen.
    Standard iOS navigation bar with back chevron and centered title "修改密码".
    Body: a white card with 3 form rows, each with a label on the left
    ("当前密码", "新密码", "确认新密码") and password input field with dot mask on right.
    Below the form: small gray text "至少 8 位，含字母和数字".
    Bottom fixed: full-width green button "保存".

# ============================================================
# 首页 + 分类（2 页）
# ============================================================

- id: P03_index
  title: 首页
  path: pages/index
  tier: V1
  vant_components: [van-search, van-tabs, van-tab, van-tabbar, van-tabbar-item, van-icon]
  copy:
    nav_title: 校园二手
    search_placeholder: 搜索想要的商品
    sort_综合: 综合
    sort_最新: 最新
    sort_价格: 价格
    empty: 暂无商品
    refresh: 下拉刷新
  layout:
    top: 搜索栏（吸顶）+ 筛选漏斗 icon
    上中: 横向滚动分类 chips（数码 / 图书 / 服饰 / 生活 / 票务）
    中: 排序 tabs（综合 / 最新 / 价格）
    main: 两列瀑布流商品卡片
    bottom: TabBar（首页 / 分类 / 发布 / 消息 / 我的）
  states: [loading, empty, error, normal, pulling_refresh]
  prompt: |
    Homepage of the campus marketplace.
    Top: search bar with placeholder "搜索想要的商品", a filter funnel icon on right.
    Below search: horizontal scrolling category chips
    (数码 / 图书 / 服饰 / 生活 / 票务), the active one has green underline.
    Below chips: sort tabs (综合 | 最新 | 价格), 综合 is active with green text + underline.
    Main area: 2-column waterfall product grid, 6 visible cards.
    Each card: square product image on top with subtle shadow,
    title 2 lines max (e.g. "九成新 Kindle Paperwhite 4 32G"),
    price "¥240" in red bold large, below: tiny seller avatar + name + "西区 3 栋".
    Bottom tab bar: 首页(active green icon+text) | 分类 | 发布(center floating green circle with plus) | 消息 | 我的.

- id: P04_category_list
  title: 分类
  path: pages/category/list
  tier: V1
  vant_components: [van-search, van-cell, van-icon]
  copy:
    nav_title: 分类
    search_placeholder: 搜索分类或商品
  layout:
    top: 搜索栏
    main: 左侧一级分类垂直列表 + 右侧二级分类网格
    bottom: TabBar
  states: [normal, loading]
  prompt: |
    Category browse screen.
    Top: search bar "搜索分类或商品".
    Body split into two columns:
    Left 30%: vertical list of 5-6 top categories (数码电子 / 图书教材 / 服饰鞋包 / 生活用品 / 票务卡券 / 其他).
    The active category (数码电子) has light green background and bold text.
    Right 70%: grid of subcategory icons (3 columns x 4 rows), each tile has
    a colored emoji icon and label below (手机 / 电脑 / 平板 / 相机 / 耳机 / 音响 / 配件 / 其他).
    Bottom tab bar (same as homepage).

