    upload_hint: 最多 9 张，建议横版实拍
    title_label: 标题
    title_placeholder: 一句话概括（建议 15-30 字）
    desc_label: 详情
    desc_placeholder: 介绍商品的成色、购买时间、瑕疵
    price_label: 价格
    price_placeholder: 期望成交价
    category_label: 分类
    condition_label: 成色
    pickup_label: 自提地点
    pledge_label: 担保质押
    pledge_hint: 上架时质押 50 校园币，争议责任在你时会扣
    verify_label: 实物认证
