  vant_components: [van-icon, van-tag, van-goods-action, van-goods-action-icon, van-goods-action-button]
  copy:
    favorite: 收藏
    chat: 聊一聊
    offer: 出价
    buy_now: 立即购买
    report: 举报
    seller_label: 卖家
    follow_seller: 关注
    verified_badge: 实物认证
    condition_label: 成色
    location_label: 自提
  layout:
    top: 图片轮播（全宽）
    上中: 价格 + 标题 + 标签 + 实物认证徽章
    中: 卖家卡片（头像 / 名 / 学院 / 关注按钮）
    main: 描述 / 成色 / 自提地点 / 相似商品
    bottom: 操作栏（收藏 / 聊一聊 | 出价 / 立即购买）
  states: [normal, sold_out, off_shelf]
  prompt: |
    Product detail page.
    Top: full-width image carousel (with 1/5 dots indicator at bottom-right of image).
    Below image: large red price "¥240" left, gray original price "¥899" with strikethrough.
    Title "九成新 Kindle Paperwhite 4 32G 无划痕" 2 lines.
    Inline green badge "实物认证" with verified-check icon, gray tag "9 成新".
    Seller card: avatar + name "李同学" + small "计算机学院 · 大三" + green outline "关注" button on right.
    Description section title "商品描述", then 4 lines of plain text.
    Meta rows: 成色 9 成新 / 自提 西区 3 栋 / 发布 2 天前.
    Bottom fixed action bar:
    Left icons (gray): 收藏 (star) + 聊一聊 (chat bubble) + 举报 (warning).
    Right buttons: green outline "出价" + filled red "立即购买".

